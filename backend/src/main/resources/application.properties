spring.application.name=watchservices-backend

# H2 in-memory database (works on Render without external DB)
spring.datasource.url=jdbc:h2:mem:watchservices;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# Server port (Render injects PORT env var)
server.port=${PORT:8080}

# CORS - allow frontend origin
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging
logging.level.com.watchservices=DEBUG
